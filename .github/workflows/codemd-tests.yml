# Written by CodeMD (codemd.dev) on its own branch to run tests.
name: CodeMD test run
'on':
  push:
    branches:
    - codemd-test-runs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: 'CodeMD test 1/1: src/mono/wasm/Wasm.Build.Tests/PInvokeTableGeneratorTests.cs'
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh 0
      timeout-minutes: 10
      continue-on-error: true
    - name: 'CodeMD: determine test result'
      if: always()
      working-directory: ${{ github.workspace }}
      run: bash .codemd/run-test.sh finalize
    - name: 'CodeMD: keep coverage reports'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codemd-coverage-reports
        path: codemd-reports
        if-no-files-found: ignore
        retention-days: 90
